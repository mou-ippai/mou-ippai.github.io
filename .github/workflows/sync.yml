name: sync
on:
  schedule: [{cron: '*/30 * * * *'}]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: replace site files
        run: |
          set -e
          git fetch --depth=1 https://github.com/tfd0313-lang/mou-ippai deploy
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          git checkout FETCH_HEAD -- .
          git add -A
          git config user.name  sync
          git config user.email sync@users.noreply.github.com
          git commit -q -m "sync $(git rev-parse --short FETCH_HEAD)" || exit 0
          git push origin HEAD:main
